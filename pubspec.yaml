name: cutcap
description: "Minimal frame-accurate video cutter for Android and Windows."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # Exact pin; CI reads this value via subosito/flutter-action's flutter-version-file.
  flutter: 3.44.8

dependencies:
  crypto: 3.0.8
  desktop_drop: 0.8.4
  ffi: 2.2.0
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  intl: any
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  path: 1.9.1
  path_provider: 2.1.6
  # ShellExecuteW, to open a finished export with the default app.
  win32: 6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  generate: true
  # Golos Text, SIL OFL 1.1 (assets/fonts/golos_text/OFL.txt). Static instances from
  # googlefonts/golos-text at cf2e272, the commit google/fonts pins for its variable build.
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/golos_text/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/golos_text/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/golos_text/GolosText-Bold.ttf
          weight: 700
