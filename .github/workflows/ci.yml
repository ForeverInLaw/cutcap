name: CI

on:
  push:
    branches: [main, integration/v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks on every push and PR. Platform build jobs (Windows, Android)
  # are added as separate jobs that `needs: check`.
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Also generates lib/l10n/app_localizations*.dart (flutter.generate: true).
      - run: flutter pub get --enforce-lockfile

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test
